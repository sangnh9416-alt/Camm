<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Giả Lập - Giao diện Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            justify-content: space-between;
        }

        /* 1. Thanh công cụ phía trên */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
        }

        .top-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .top-icon {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            opacity: 0.9;
        }

        .pill-dropdown {
            background: rgba(40, 40, 40, 0.6);
            border: none;
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 14px;
            cursor: pointer;
        }

        .brand-badge {
            background: #ffffff;
            color: #000;
            font-weight: bold;
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        /* 2. Khung ngắm camera (Viewfinder) */
        .viewfinder {
            flex: 1;
            position: relative;
            background: #080808;
            margin: 4px 8px;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Các góc khung ngắm (Corner brackets) */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: rgba(255, 255, 255, 0.5);
            border-style: solid;
            pointer-events: none;
        }
        .corner-tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
        .corner-tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
        .corner-bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
        .corner-br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

        /* Biểu tượng thông báo khóa ở giữa khung hình */
        .lock-indicator {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 82, 82, 0.3);
            border-radius: 12px;
            z-index: 5;
            backdrop-filter: blur(5px);
        }

        .lock-indicator span {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }

        .lock-indicator p {
            color: #ff5252;
            font-size: 13px;
            font-weight: bold;
        }

        /* 3. Thanh tùy chỉnh Zoom */
        .zoom-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 20px;
            background: #000;
            font-size: 14px;
        }

        .zoom-btn {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            padding: 4px 8px;
            font-weight: 500;
        }

        .zoom-btn.active {
            color: #ff453a;
            font-weight: bold;
        }

        /* 4. Thanh chọn Chế độ chụp */
        .mode-selector {
            display: flex;
            gap: 24px;
            overflow-x: auto;
            padding: 10px 20px;
            background: #000;
            white-space: nowrap;
            scrollbar-width: none; /* Ẩn thanh cuộn trên Firefox */
        }
        .mode-selector::-webkit-scrollbar {
            display: none; /* Ẩn thanh cuộn trên Chrome/Safari */
        }

        .mode-item {
            color: #888;
            font-size: 15px;
            cursor: pointer;
            background: none;
            border: none;
            font-weight: 400;
        }

        .mode-item.active {
            color: #ff453a;
            font-weight: bold;
        }

        /* 5. Thanh điều khiển đáy (Thư viện, Nút chụp, Đổi camera) */
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px 30px 30px;
            background: #000;
        }

        .gallery-thumbnail {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            background: #222;
            border: 1.5px solid #555;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
        }

        /* Nút chụp ảnh chính (Shutter) */
        .shutter-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: transparent;
            border: 4px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 3px;
        }

        .shutter-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #ffffff;
            transition: transform 0.1s ease;
        }

        .shutter-btn:active .shutter-inner {
            transform: scale(0.85);
        }

        .switch-camera-btn {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Hộp thông báo nổi (Toast) khi bấm bất kỳ nút nào */
        .toast-alert {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(255, 69, 58, 0.95);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 100;
            text-align: center;
        }

        .toast-alert.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- 1. Thanh phía trên -->
    <div class="top-bar">
        <div class="top-icons">
            <button class="top-icon" onclick="showAlert('Đèn flash đã bị khóa')">⚡</button>
            <button class="top-icon" onclick="showAlert('Tính năng HDR bị vô hiệu hóa')">HDR</button>
        </div>
        <div>
            <button class="pill-dropdown" onclick="showAlert('Menu cài đặt đã bị khóa')">⌄</button>
        </div>
        <div class="top-icons">
            <button class="top-icon" onclick="showAlert('Bộ lọc màu bị khóa')">⚙️</button>
            <div class="brand-badge">CAM</div>
        </div>
    </div>

    <!-- 2. Khung ngắm camera giả lập -->
    <div class="viewfinder">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <div class="lock-indicator">
            <span>🔒</span>
            <p>QUYỀN TRUY CẬP BỊ KHÓA</p>
        </div>
    </div>

    <!-- 3. Thanh chọn mức Zoom -->
    <div class="zoom-bar">
        <button class="zoom-btn" onclick="showAlert('Không thể thay đổi tiêu cự')">0.6</button>
        <button class="zoom-btn active" onclick="showAlert('Camera đang khóa ở mức 1x')">1x</button>
        <button class="zoom-btn" onclick="showAlert('Không thể thay đổi tiêu cự')">2</button>
        <button class="zoom-btn" onclick="showAlert('Không thể thay đổi tiêu cự')">2.6</button>
        <button class="zoom-btn" onclick="showAlert('Không thể thay đổi tiêu cự')">5</button>
    </div>

    <!-- 4. Thanh chọn Chế độ -->
    <div class="mode-selector">
        <button class="mode-item" onclick="switchMode(this)">Chuyên nghiệp</button>
        <button class="mode-item" onclick="switchMode(this)">Video</button>
        <button class="mode-item active" onclick="switchMode(this)">Ảnh</button>
        <button class="mode-item" onclick="switchMode(this)">Chân dung</button>
        <button class="mode-item" onclick="switchMode(this)">Tài liệu</button>
    </div>

    <!-- 5. Thanh điều khiển dưới cùng -->
    <div class="bottom-controls">
        <div class="gallery-thumbnail" onclick="showAlert('Thư viện ảnh đã bị khóa')">📁</div>
        
        <div class="shutter-btn" onclick="showAlert('Lỗi: Không thể chụp ảnh do phần cứng bị khóa!')">
            <div class="shutter-inner"></div>
        </div>

        <button class="switch-camera-btn" onclick="showAlert('Không thể chuyển đổi camera trước/sau')">🔄</button>
    </div>

    <!-- Khung thông báo lỗi bật lên -->
    <div class="toast-alert" id="toast">Cảnh báo: Ứng dụng Camera đang bị khóa!</div>

    <script>
        let timer = null;

        function showAlert(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            if (timer) clearTimeout(timer);
            timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function switchMode(element) {
            document.querySelectorAll('.mode-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');
            showAlert('Chế độ "' + element.textContent + '" đang bị khóa!');
        }
    </script>
</body>
</html>
